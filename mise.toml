[tools]
lefthook = "v2.1.17"
node = "24.15.0"

[settings]
minimum_release_age = "7d" # サプライチェーン攻撃対策

[tasks.dev]
run = "docker compose up -d --build --wait"
depends_post = ["migrate-run"]

[tasks.migrate-ready]
run = "docker compose exec app npm run migrate:ready"

[tasks.migrate-run]
run = "docker compose exec app npm run migrate:run"

[tasks.test]
run = "docker compose exec app npm run test"

[tasks."test:arg"]
run = "docker compose exec app npm run test --prefix"

[tasks.shell]
run = "docker compose exec app sh"

[hooks]
postinstall = [
  "tsx 01-scripts/setup/index.ts",
  "lefthook install",
]
