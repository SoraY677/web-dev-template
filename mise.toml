[tools]
node = "24.15.0"

[settings]
minimum_release_age = "7d" # サプライチェーン攻撃対策

[tasks.dev]
run = "docker compose up -d --build"

[tasks.test]
run = "docker compose exec app npm run test"

[tasks."test:arg"]
run = "docker compose exec app npm run test --prefix"

[hooks]
postinstall = "node 01-scripts/setup/index.ts"
