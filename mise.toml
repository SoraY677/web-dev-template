[tools]
gh = "2.104.0"
lefthook = "v2.1.17"
node = "24.15.0"
terraform = "1.14.8"

[settings]
minimum_release_age = "7d" # サプライチェーン攻撃対策

[env]
_.file = ".env"

[tasks.init]
dir = "02-config/repo"
# terraformの変数(variables.tf)へ渡す
env = {
  TF_VAR_github_owner = "{{ env.GITHUB_OWNER }}", TF_VAR_github_repository = "{{ env.GITHUB_REPOSITORY }}"
}
run = "terraform apply -auto-approve"

[tasks.dev]
run = "docker compose up -d --build --wait"
depends_post = ["migrate-run"]

[tasks.migrate-ready]
run = "docker compose exec app npm run migrate:ready"

[tasks.migrate-run]
run = "docker compose exec app npm run migrate:run"

[tasks.test]
run = "docker compose exec app npm run test"

[tasks."test:arg"]
run = "docker compose exec app npm run test --prefix"

[tasks.shell]
run = "docker compose exec app sh"

[hooks]
postinstall = [
  "npm ci",
  "npx tsx 01-scripts/setup/index.ts",
  "terraform -chdir=02-config/repo init",
  "lefthook install",
]
